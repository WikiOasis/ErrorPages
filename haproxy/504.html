<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>504 • Gateway Timeout</title>
<link rel="icon" type="image/x-icon" href="https://cdn.wikioasis.org/metawiki/1/18/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Mozilla+Headline:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  padding: 48px 10%;
  background:
    radial-gradient(ellipse 60% 55% at 85% 95%, rgba(47, 143, 214, 0.16), transparent 70%),
    #16212f;
  color: #e8ecef;
  overflow: hidden;
  position: relative;
}

.glow {
  position: fixed;
  right: -8vw;
  bottom: -12vw;
  width: 60vw;
  height: 60vw;
  max-width: 760px;
  max-height: 760px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(74, 168, 232, 0.28), transparent 65%);
  filter: blur(40px);
  pointer-events: none;
  animation: breathe 9s ease-in-out infinite;
}

.decor {
  position: fixed;
  right: 0;
  bottom: 0;
  z-index: 0;
  pointer-events: none;
}

.tile {
  transform-box: fill-box;
  transform-origin: 50% 50%;
  transition: transform 1.2s cubic-bezier(0.65, 0, 0.35, 1);
}

.container {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  max-width: 620px;
  animation: rise 0.6s ease-out both;
}

.logo { width: 210px; height: auto; margin-bottom: 56px; }

h1 {
  font-family: 'Mozilla Headline', 'Inter', system-ui, sans-serif;
  font-size: clamp(42px, 5.8vw, 66px);
  font-weight: 600;
  line-height: 1.04;
  letter-spacing: -0.025em;
  color: #e8ecef;
  max-width: 16ch;
}

.description {
  font-size: 16px;
  line-height: 1.6;
  color: rgba(255, 255, 255, 0.55);
  margin-top: 16px;
  max-width: 46ch;
}

.cf-error-wrap { margin-top: 36px; max-width: 480px; }

.cf-error-box {
  padding: 18px 22px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.cf-error-box,
.cf-error-box * {
  background: transparent !important;
  color: #e8ecef !important;
  font-family: 'Inter', sans-serif !important;
  border-color: transparent !important;
}

.cf-error-box h2 { font-size: 16px !important; font-weight: 600 !important; margin-bottom: 8px !important; }
.cf-error-box p { font-size: 13px !important; color: rgba(255, 255, 255, 0.55) !important; margin-bottom: 10px !important; line-height: 1.5 !important; }
.cf-error-box ul { padding-left: 18px !important; display: flex !important; flex-direction: column !important; gap: 4px !important; }
.cf-error-box li { font-size: 12px !important; color: rgba(255, 255, 255, 0.45) !important; }

.buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }

.btn {
  padding: 11px 26px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.07);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
}
.btn:hover { background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.2); }
.btn:active { transform: scale(0.98); }
.btn:focus-visible { outline: 2px solid #4aa8e8; outline-offset: 3px; }
.btn.primary { background: #2f8fd6; border-color: #4aa8e8; }
.btn.primary:hover { background: #3a9be3; box-shadow: 0 0 22px rgba(74, 168, 232, 0.4); }

.ray-id { font-size: 12px; color: rgba(255, 255, 255, 0.35); margin-top: 10px; }

.challenge-spinner-row { display: flex; align-items: center; gap: 10px; color: rgba(255, 255, 255, 0.5); font-size: 13px; transition: opacity 0.3s ease; }
.challenge-spinner-row.hidden { opacity: 0; pointer-events: none; }
.challenge-spinner { width: 18px; height: 18px; border: 2px solid rgba(255, 255, 255, 0.15); border-top-color: rgba(111, 197, 241, 0.9); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
#challenge-box { opacity: 0; max-height: 0; overflow: hidden; transition: opacity 0.3s ease; }
#challenge-box.visible { opacity: 1; max-height: 600px; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes breathe { 0%, 100% { opacity: 0.55; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1.05); } }

@media (max-width: 600px) {
  body { padding: 56px 24px 32px; align-items: flex-start; }
  .decor { opacity: 0.8; }
  .logo { width: 170px; margin-bottom: 40px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<svg class="decor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="container">
  <img class="logo" src="https://cdn.wikioasis.org/metawiki/3/38/WikiOasis_Logo.png" alt="WikiOasis">
  <h1>504: Gateway Timeout</h1>
  <p class="description">Our servers didn’t answer in time. Please try again in a few moments.</p>

  <div class="buttons"><a class="btn primary" href="javascript:location.reload()">Try again</a><a class="btn" href="https://discord.gg/GrrTcsVC2x">Discord</a><a class="btn" href="https://status.wikioasis.org/">Status</a></div>
</div>
<script>
(function () {
  var svg = document.querySelector('.decor');
  var NS = 'http://www.w3.org/2000/svg';
  var GRADIENTS = [['#6fc5f1', '#2f8fd6'], ['#4aa8e8', '#2470bd'], ['#2c6fb0', '#184f86'], ['#8fd8f7', '#4aa8e8']];
  var WEIGHTS = [4, 4, 3, 1];
  var seed = (Math.random() * 4294967296) >>> 0;
  function rand() {
    seed = (seed + 0x6D2B79F5) >>> 0;
    var t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function pick() {
    var r = rand() * 12, i = 0;
    while (r >= WEIGHTS[i]) r -= WEIGHTS[i++];
    return i;
  }
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tiles = [];
  var timer = null;

  function build() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var cell = Math.max(48, Math.min(vw, vh) * 0.1);
    var cols = Math.max(3, Math.min(14, Math.ceil(vw * 0.5 / cell)));
    var rows = Math.max(3, Math.min(12, Math.ceil(vh * 0.7 / cell)));
    var half = cell / 2;
    var w = cols * cell, h = rows * cell;
    seed = seed || 1;
    var saved = seed;
    seed = build.base;
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.style.width = w + 'px';
    svg.style.height = h + 'px';
    svg.textContent = '';
    var defs = document.createElementNS(NS, 'defs');
    GRADIENTS.forEach(function (g, i) {
      var lg = document.createElementNS(NS, 'linearGradient');
      lg.setAttribute('id', 'g' + i);
      lg.setAttribute('x1', '0.15'); lg.setAttribute('y1', '0');
      lg.setAttribute('x2', '0.85'); lg.setAttribute('y2', '1');
      [0, 1].forEach(function (k) {
        var stop = document.createElementNS(NS, 'stop');
        stop.setAttribute('offset', k);
        stop.setAttribute('stop-color', g[k]);
        lg.appendChild(stop);
      });
      defs.appendChild(lg);
    });
    svg.appendChild(defs);
    tiles = [];
    function add(x, y, size, turn, grad) {
      var g = document.createElementNS(NS, 'g');
      g.setAttribute('transform', 'translate(' + x + ',' + y + ')');
      var p = document.createElementNS(NS, 'path');
      p.setAttribute('class', 'tile');
      p.setAttribute('data-r', turn);
      p.setAttribute('d', 'M0,0 L' + size + ',0 A' + size + ',' + size + ' 0 0 1 0,' + size + ' Z');
      p.setAttribute('fill', 'url(#g' + grad + ')');
      p.style.transform = 'rotate(' + turn + 'deg)';
      g.appendChild(p);
      svg.appendChild(g);
      tiles.push(p);
    }
    var grid = [];
    for (var row = 0; row < rows; row++) {
      grid[row] = [];
      for (var col = 0; col < cols; col++) {
        var dx = (cols - 1 - col) / cols, dy = (rows - 1 - row) / rows;
        var d = Math.sqrt(dx * dx + dy * dy);
        var keep = d < 0.3 ? 1 : Math.max(0, 1 - Math.pow((d - 0.3) / 0.7, 1.4));
        grid[row][col] = rand() < keep;
      }
    }
    // drop tiles not connected towards the corner, so nothing floats alone
    for (row = rows - 1; row >= 0; row--) {
      for (col = cols - 1; col >= 0; col--) {
        if (!grid[row][col] || (row === rows - 1 && col === cols - 1)) continue;
        var right = col < cols - 1 && grid[row][col + 1];
        var below = row < rows - 1 && grid[row + 1][col];
        if (!right && !below) grid[row][col] = false;
      }
    }
    for (row = 0; row < rows; row++) {
      for (col = 0; col < cols; col++) {
        if (grid[row][col]) add(col * cell, row * cell, cell, Math.floor(rand() * 4) * 90, pick());
      }
    }
    seed = saved;
  }
  build.base = seed;

  function turn(tile) {
    var angle = (parseInt(tile.getAttribute('data-r'), 10) || 0) + 90;
    tile.setAttribute('data-r', angle);
    tile.style.transform = 'rotate(' + angle + 'deg)';
  }
  function tick() {
    if (tiles.length) {
      var count = Math.random() < 0.4 ? 2 : 1;
      for (var i = 0; i < count; i++) turn(tiles[Math.floor(Math.random() * tiles.length)]);
    }
    setTimeout(tick, 1100 + Math.random() * 1400);
  }

  build();
  var lastW = window.innerWidth, lastH = window.innerHeight;
  window.addEventListener('resize', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (window.innerWidth !== lastW || window.innerHeight !== lastH) {
        lastW = window.innerWidth; lastH = window.innerHeight;
        build();
      }
    }, 150);
  });
  if (!reduced) setTimeout(tick, 900);
})();
</script>

</body>
</html>
